[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-vertical-forge"
version = "0.1.0"
description = "Generate killinchu-pattern vertical shells from audited configs - deterministic, receipted, fail-closed"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
szl_vertical_forge = ["verticals.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
