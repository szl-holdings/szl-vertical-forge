name: tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --disable-pip-version-check --no-build-isolation -e . 'pytest==8.4.2'
      - run: python -m pytest tests/ -v
      - run: python -m szl_vertical_forge.forge verify --output-dir dist
      - run: python -m szl_vertical_forge.forge generate --output-dir dist-ci
      - run: python -m szl_vertical_forge.forge verify --output-dir dist-ci
